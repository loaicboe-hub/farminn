<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="auth.resetPassword">Reset Password</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/base.css">
  <link rel="stylesheet" href="../design-system/components.css">
</head>
<body class="auth-page">
  <main class="auth-card card stack">
    <div class="cluster" style="justify-content: space-between;">
      <strong data-setting="site_name" data-i18n="admin.brand">Admin Foundation</strong>
      <label class="sr-only" for="reset-lang-select" data-i18n="common.selectLanguage">Select language</label>
      <select id="reset-lang-select" class="lang-select" data-lang-switcher>
        <option value="ar">العربية (AR)</option>
        <option value="en" selected>English (EN)</option>
        <option value="fr">Français (FR)</option>
        <option value="ru">Русский (RU)</option>
        <option value="de">Deutsch (DE)</option>
        <option value="es">Español (ES)</option>
      </select>
    </div>

    <div>
      <h1 style="font-size: var(--text-2xl);" data-i18n="auth.resetPassword">Reset Password</h1>
      <p class="form-hint" data-i18n="auth.resetTokenNote">
        Single-use, time-limited reset token must be verified on the server before updating password hash.
      </p>
    </div>

    <form class="form-grid" action="/api/auth/reset-password" method="post" data-blueprint-form>
      <!-- Server must inject and validate single-use reset token; never expose token in Referer headers -->
      <input type="hidden" name="token" value="">

      <div class="form-field">
        <label class="form-label" for="reset-new-password" data-i18n="form.newPassword">New Password</label>
        <input class="form-control" id="reset-new-password" name="new_password" type="password" autocomplete="new-password" minlength="10" required>
      </div>

      <div class="form-field">
        <label class="form-label" for="reset-confirm-password" data-i18n="form.confirmPassword">Confirm Password</label>
        <input class="form-control" id="reset-confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="10" required>
      </div>

      <button class="btn btn--primary" type="submit" data-i18n="auth.resetPassword">Reset Password</button>
    </form>

    <a href="./auth-login.html" style="font-size: var(--text-sm);" data-i18n="auth.backToLogin">Back to Sign In</a>
  </main>

  <script type="module" src="./shell.js"></script>
</body>
</html>
